{% extends 'base.html' %}{% block title %}Sign in · Nexora{% endblock %}{% block content %}<section class="auth"><div class="auth-head"><p class="eyebrow">Secure workspace</p><h1>Welcome back.</h1><p class="lead">Sign in to your company's private analytics space.</p></div><div class="panel">{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="username">Username</label><input id="username" name="username" required autofocus placeholder="Your username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required placeholder="Your password"></div><button class="full" type="submit">Open workspace →</button></form><p class="muted">New here? <a href="{% url 'register_view' %}" style="color:#9ab0ff">Create your organization</a></p></div></section>{% endblock %}
